spring:
  application:
    name: notification-service
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/notification_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        spring.json.add.type.headers: false
        enable.idempotence: true
    consumer:
      group-id: notification-processor
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

notification:
  kafka:
    topics:
      requested: notification.requested
      requested-priority: notification.requested.priority
      retry: notification.retry
      dead-letter: notification.dead-letter
      status: notification.status
    consumer:
      concurrency: ${KAFKA_CONSUMER_CONCURRENCY:3}
      priority-concurrency: ${KAFKA_PRIORITY_CONCURRENCY:6}
  retry:
    max-attempts: ${NOTIFICATION_MAX_RETRIES:3}
    initial-interval-ms: ${NOTIFICATION_RETRY_INITIAL_MS:1000}
    multiplier: ${NOTIFICATION_RETRY_MULTIPLIER:2.0}
    max-interval-ms: ${NOTIFICATION_RETRY_MAX_MS:60000}
  rate-limit:
    enabled: true
    requests-per-minute: ${RATE_LIMIT_PER_MINUTE:100}
  template-cache:
    ttl-seconds: ${TEMPLATE_CACHE_TTL_SECONDS:300}
  reconciliation:
    enabled: true
    fixed-delay-ms: 60000
    stuck-threshold-minutes: 5
  security:
    jwt-secret: ${JWT_SECRET:change-me-to-a-very-long-secret-key-at-least-256-bits}
    jwt-expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  providers:
    email: ${EMAIL_PROVIDER:logging}
    sms: ${SMS_PROVIDER:logging}
    push: ${PUSH_PROVIDER:logging}
  twilio:
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    from-number: ${TWILIO_FROM_NUMBER:}
  fcm:
    server-key: ${FCM_SERVER_KEY:}

logging:
  level:
    root: INFO
    com.example.notification: INFO
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] correlationId=%X{correlationId} requestId=%X{requestId} notificationId=%X{notificationId} clientId=%X{clientId} kafkaEventId=%X{kafkaEventId} %logger{36} - %msg%n"

---
spring:
  config:
    activate:
      on-profile: local

notification:
  providers:
    email: logging
    sms: logging
    push: logging
  security:
    jwt-secret: local-dev-secret-key-must-be-at-least-32-chars-long!!

logging:
  level:
    com.example.notification: DEBUG

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:mysql://mysql:3306/notification_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
  data:
    redis:
      host: redis
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:19092}

notification:
  providers:
    email: ${EMAIL_PROVIDER:logging}
    sms: ${SMS_PROVIDER:logging}
    push: ${PUSH_PROVIDER:logging}
